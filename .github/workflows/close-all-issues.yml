name: Close All Open Issues

on:
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close all open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Starting to close all open issues..."
          page=1
          while true; do
            issues=$(gh issue list --repo "$REPO" --state open --limit 100 --page $page --json number --jq '.[].number')
            if [ -z "$issues" ]; then
              echo "No more issues found. Completed!"
              break
            fi
            echo "Processing page $page..."
            echo "$issues" | while read -r num; do
              if [ -n "$num" ]; then
                echo "Closing issue #$num..."
                gh issue close "$num" --repo "$REPO" --reason "completed" || echo "Failed to close #$num"
              fi
            done
            page=$((page + 1))
            sleep 1
          done
          echo "All issues closed!"
