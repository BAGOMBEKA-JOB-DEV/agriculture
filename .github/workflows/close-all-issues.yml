name: Close All Open Issues

on:
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close all open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Starting to close all open issues..."
          issues=$(gh issue list --repo "$REPO" --state open --limit 1000 --json number --jq '.[].number')
          
          count=0
          echo "$issues" | while read -r num; do
            if [ -n "$num" ]; then
              echo "Closing issue #$num..."
              gh issue close "$num" --repo "$REPO" --reason "completed" || echo "Failed to close #$num"
              count=$((count + 1))
              if [ $((count % 100)) -eq 0 ]; then
                echo "Closed $count issues so far..."
                sleep 2
              fi
            fi
          done
          
          echo "Completed closing issues!"
